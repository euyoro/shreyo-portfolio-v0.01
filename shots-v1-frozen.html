<style>
  /* ── TOKENS ── */
  :root {
    --bg:           #100d0d;
    --text:         #e5dede;
    --muted:        #534141;
    --subtle:       #171212;
    --accent:       #F53640;
    --rule:         rgba(255,228,224,0.06);
    --frame-bg:     #1f1818;
    --frame-border: #312524;
    --frame-island: #000;
    --panel-w:      220px;
    --trans:        0.3s cubic-bezier(0.4,0,0.2,1);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg:           #F3EFEE;
      --text:         #170d0d;
      --muted:        #b09898;
      --subtle:       #EAE3E2;
      --accent:       #C81019;
      --rule:         rgba(0,0,0,0.07);
      --frame-bg:     #DFD5D4;
      --frame-border: #C7B5B4;
      --frame-island: #190c0c;
    }
  }
  :root[data-theme="light"] {
    --bg:           #F3EFEE;
    --text:         #170d0d;
    --muted:        #b09898;
    --subtle:       #EAE3E2;
    --accent:       #C81019;
    --rule:         rgba(0,0,0,0.07);
    --frame-bg:     #DFD5D4;
    --frame-border: #C7B5B4;
    --frame-island: #190c0c;
  }
  :root[data-theme="dark"] {
    --bg:           #100d0d;
    --text:         #e5dede;
    --muted:        #534141;
    --subtle:       #171212;
    --accent:       #F53640;
    --rule:         rgba(255,228,224,0.06);
    --frame-bg:     #1f1818;
    --frame-border: #312524;
    --frame-island: #000;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
    line-height: 1.5;
    display: flex;
    min-height: 100vh;
  }

  /* ── LEFT PANEL ── */
  .panel {
    position: fixed;
    top: 0; left: 0;
    width: var(--panel-w);
    height: 100vh;
    border-right: 1px solid var(--rule);
    display: flex;
    flex-direction: column;
    padding: 36px 28px 32px;
    z-index: 20;
    background: var(--bg);
  }

  /* Row 1: name + role tag */
  .p-identity {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 28px;
  }
  .p-name {
    font-family: 'HK Grotesk', -apple-system, sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .p-role {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
  }

  /* Adaptive block */
  .p-adaptive {
    flex: 1;
    position: relative;
  }
  .p-state {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    opacity: 0;
    transform: translateY(5px);
    transition: opacity var(--trans), transform var(--trans);
    pointer-events: none;
  }
  .p-state.active {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  /* Intro tagline */
  .p-tagline {
    font-size: 13px;
    line-height: 1.65;
    color: var(--muted);
    white-space: pre-line;
  }

  /* Project label row */
  .p-project {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 8px;
  }
  .p-project-name {
    font-family: 'HK Grotesk', -apple-system, sans-serif;
    font-weight: 600;
    font-size: 13px;
    color: var(--text);
  }
  .p-arrow {
    color: var(--muted);
    font-size: 12px;
    line-height: 1;
  }
  .p-project-tag {
    margin-left: auto;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--accent);
    font-family: 'SF Mono', 'Consolas', monospace;
  }
  .p-desc {
    font-size: 12px;
    line-height: 1.7;
    color: var(--muted);
  }

  /* Bottom icons */
  .p-bottom {
    display: flex;
    align-items: center;
    gap: 14px;
    padding-top: 24px;
    border-top: 1px solid var(--rule);
  }
  .p-icon {
    color: var(--muted);
    text-decoration: none;
    transition: color 0.15s;
    display: flex;
    align-items: center;
  }
  .p-icon:hover { color: var(--text); }
  .p-icon svg { width: 14px; height: 14px; display: block; }

  /* Theme toggle — pushes right */
  .theme-btn {
    margin-left: auto;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--muted);
    padding: 0;
    display: flex;
    align-items: center;
    transition: color 0.15s;
  }
  .theme-btn:hover { color: var(--text); }
  .theme-btn svg { width: 13px; height: 13px; display: block; }

  /* sun/moon */
  [data-theme="dark"]  .i-sun  { display: block; }
  [data-theme="dark"]  .i-moon { display: none;  }
  [data-theme="light"] .i-sun  { display: none;  }
  [data-theme="light"] .i-moon { display: block; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) .i-sun  { display: block; }
    :root:not([data-theme]) .i-moon { display: none;  }
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme]) .i-sun  { display: none;  }
    :root:not([data-theme]) .i-moon { display: block; }
  }

  /* ── RIGHT SCROLL AREA ── */
  .shots {
    margin-left: var(--panel-w);
    flex: 1;
    padding: 36px 24px 100px;
    min-width: 0;
  }

  .cat { margin-bottom: 60px; }
  .cat-rule {
    height: 1px;
    background: var(--rule);
    margin-bottom: 14px;
  }

  /* CSS columns masonry */
  .grid      { columns: 2; column-gap: 8px; }
  .grid.col-3 { columns: 3; }

  .grid-item {
    break-inside: avoid;
    margin-bottom: 8px;
    display: block;
    width: 100%;
  }
  .grid-item img,
  .grid-item video {
    display: block;
    width: 100%;
    height: auto;
  }
  .grid-item video { background: var(--subtle); }

  /* ── PHONE MOCKUP ── */
  .mockup-phone {
    background: var(--frame-bg);
    border-radius: 44px;
    border: 8px solid var(--frame-border);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(255,255,255,0.04);
    padding: 52px 10px 22px;
    position: relative;
    max-width: 210px;
    width: 100%;
    margin: 0 auto;
  }
  /* dynamic island */
  .mockup-phone::before {
    content: '';
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: 86px;
    height: 26px;
    background: var(--frame-island);
    border-radius: 14px;
  }
  /* home indicator */
  .mockup-phone::after {
    content: '';
    display: block;
    width: 72px;
    height: 4px;
    background: var(--frame-border);
    border-radius: 2px;
    margin: 10px auto 0;
    opacity: 0.55;
  }
  .mockup-phone img {
    border-radius: 14px;
    width: 100%;
    display: block;
  }

  /* ── DESKTOP MOCKUP ── */
  .mockup-desktop {
    background: var(--frame-bg);
    border-radius: 10px;
    border: 1.5px solid var(--frame-border);
    box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    overflow: hidden;
  }
  .mockup-desktop-bar {
    display: flex;
    align-items: center;
    padding: 9px 12px;
    gap: 6px;
    border-bottom: 1px solid var(--rule);
  }
  .mockup-desktop-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .mockup-desktop-dot:nth-child(1) { background: #FF5F57; }
  .mockup-desktop-dot:nth-child(2) { background: #FFBD2E; }
  .mockup-desktop-dot:nth-child(3) { background: #28C840; }
  .mockup-desktop-url {
    flex: 1;
    height: 18px;
    background: var(--subtle);
    border-radius: 4px;
    margin-left: 8px;
    opacity: 0.6;
  }
  .mockup-desktop img,
  .mockup-desktop video {
    display: block;
    width: 100%;
    height: auto;
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 860px) {
    :root { --panel-w: 0px; }
    .panel {
      position: static;
      width: 100%;
      height: auto;
      border-right: none;
      border-bottom: 1px solid var(--rule);
      padding: 24px 20px;
      flex-direction: row;
      align-items: center;
      gap: 16px;
    }
    .p-identity { margin-bottom: 0; }
    .p-adaptive { display: none; }
    .p-bottom { padding-top: 0; border-top: none; }
    .shots { margin-left: 0; padding: 20px 14px 60px; }
    .grid.col-3 { columns: 2; }
  }
  @media (max-width: 480px) {
    .grid, .grid.col-3 { columns: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .p-state { transition: none; }
  }
</style>
</head>

<main  class="shots" id="shots"></main>

<script>
(function () {
  const data = JSON.parse(document.getElementById('shots-data').textContent);
  const { designer, categories } = data;

  /* ── SVG ICONS ── */
  const icons = {
    portfolio: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M5 3V2a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1"/></svg>`,
    linkedin:  `<svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 2.5A.5.5 0 0 1 2.5 2h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1A.5.5 0 0 1 2 3.5v-1ZM2 6h2v8H2V6Zm3.5 0H7v1.1C7.4 6.4 8.1 6 9.2 6c2.1 0 2.8 1.4 2.8 3.2V14h-2v-4.4c0-.9-.3-1.6-1.2-1.6-.9 0-1.3.6-1.3 1.7V14H5.5V6Z"/></svg>`,
    behance:   `<svg viewBox="0 0 16 16" fill="currentColor"><path d="M6.2 7.2c.7-.3 1.1-.9 1.1-1.7C7.3 4.1 6.4 3 4.5 3H1v10h3.8c2 0 3.2-1.1 3.2-2.8 0-1.1-.6-1.9-1.8-2ZM2.8 4.5h1.5c.8 0 1.3.4 1.3 1.1 0 .8-.5 1.2-1.4 1.2H2.8V4.5Zm1.8 7H2.8V8.2h1.9c1 0 1.6.5 1.6 1.3 0 .9-.6 1.4-1.7 1.4Zm5.7-7.4h3.4v-.9H10.3v.9ZM11.6 6c-1.8 0-3 1.3-3 3.1 0 1.9 1.2 3.1 3.1 3.1 1.4 0 2.3-.6 2.7-1.7h-1.5c-.2.5-.7.7-1.2.7-.9 0-1.4-.6-1.5-1.6h4.3c0-.1.01-.3.01-.5 0-1.9-1-3.1-2.9-3.1Zm-1.4 2.5c.1-.9.6-1.5 1.4-1.5.8 0 1.3.6 1.4 1.5h-2.8Z"/></svg>`,
    email:     `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="3.5" width="13" height="9" rx="1.5"/><path d="m1.5 4 6.5 5 6.5-5"/></svg>`
  };

  /* ── BUILD LEFT PANEL ── */
  const panel = document.getElementById('panel');

  // Identity row
  const identity = document.createElement('div');
  identity.className = 'p-identity';
  identity.innerHTML = `<span class="p-name">${designer.name}</span><span class="p-role">${designer.role}</span>`;
  panel.appendChild(identity);

  // Adaptive block
  const adaptive = document.createElement('div');
  adaptive.className = 'p-adaptive';
  adaptive.id = 'adaptive';

  // Intro state
  const intro = document.createElement('div');
  intro.className = 'p-state active';
  intro.dataset.id = '__intro';
  intro.innerHTML = `<p class="p-tagline">${designer.tagline}</p>`;
  adaptive.appendChild(intro);

  // Per-category states
  categories.forEach(c => {
    const s = document.createElement('div');
    s.className = 'p-state';
    s.dataset.id = c.id;
    s.innerHTML = `
      <div class="p-project">
        <span class="p-project-name">${c.label}</span>
        <span class="p-arrow">—</span>
        <span class="p-project-tag">${c.tag}</span>
      </div>
      <p class="p-desc">${c.description}</p>`;
    adaptive.appendChild(s);
  });
  panel.appendChild(adaptive);

  // Bottom icon links + theme
  const bottom = document.createElement('div');
  bottom.className = 'p-bottom';
  designer.links.forEach(l => {
    const a = document.createElement('a');
    a.className = 'p-icon';
    a.href = l.href;
    a.setAttribute('aria-label', l.label);
    if (l.external) { a.target = '_blank'; a.rel = 'noopener'; }
    a.innerHTML = icons[l.icon] || '';
    bottom.appendChild(a);
  });

  const themeBtn = document.createElement('button');
  themeBtn.className = 'theme-btn';
  themeBtn.type = 'button';
  themeBtn.setAttribute('aria-label', 'Toggle theme');
  themeBtn.innerHTML = `
    <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>`;
  themeBtn.addEventListener('click', () => {
    const cur  = document.documentElement.getAttribute('data-theme');
    const dark = cur === 'dark' || (!cur && window.matchMedia('(prefers-color-scheme: dark)').matches);
    const next = dark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch(e) {}
  });
  bottom.appendChild(themeBtn);
  panel.appendChild(bottom);

  /* ── BUILD RIGHT GRID ── */
  const shots = document.getElementById('shots');

  categories.forEach(cat => {
    const sec = document.createElement('section');
    sec.className = 'cat';
    sec.dataset.id = cat.id;
    sec.appendChild(Object.assign(document.createElement('div'), { className: 'cat-rule' }));

    const grid = document.createElement('div');
    grid.className = cat.columns === 3 ? 'grid col-3' : 'grid';

    cat.items.forEach(item => {
      const cell = document.createElement('div');
      cell.className = 'grid-item';

      function makeDesktopFrame(inner) {
        const wrap = document.createElement('div');
        wrap.className = 'mockup-desktop';
        const bar = document.createElement('div');
        bar.className = 'mockup-desktop-bar';
        [0,1,2].forEach(() => {
          const d = document.createElement('div');
          d.className = 'mockup-desktop-dot';
          bar.appendChild(d);
        });
        const url = document.createElement('div');
        url.className = 'mockup-desktop-url';
        bar.appendChild(url);
        wrap.appendChild(bar);
        wrap.appendChild(inner);
        return wrap;
      }

      if (item.type === 'video') {
        const v = document.createElement('video');
        v.src = item.src;
        if (item.poster) v.poster = item.poster;
        v.setAttribute('aria-label', item.alt || '');
        v.muted = true;
        v.playsInline = true;
        if (item.loop) v.loop = true;
        v.dataset.autoplay = '1';
        v.setAttribute('controls', '');
        if (item.mockup === 'desktop') {
          cell.appendChild(makeDesktopFrame(v));
        } else {
          cell.appendChild(v);
        }
      } else {
        const img = document.createElement('img');
        img.src = item.src;
        img.alt = item.alt || '';
        img.loading = 'lazy';

        if (item.mockup === 'phone') {
          const frame = document.createElement('div');
          frame.className = 'mockup-phone';
          frame.appendChild(img);
          cell.appendChild(frame);
        } else if (item.mockup === 'desktop') {
          cell.appendChild(makeDesktopFrame(img));
        } else {
          cell.appendChild(img);
        }
      }

      grid.appendChild(cell);
    });

    sec.appendChild(grid);
    shots.appendChild(sec);
  });

  /* ── ADAPTIVE LEFT: IntersectionObserver ── */
  const states   = () => document.querySelectorAll('.p-state');
  const sections = document.querySelectorAll('.cat[data-id]');

  function setActive(id) {
    states().forEach(s => s.classList.toggle('active', s.dataset.id === id));
  }

  // Sentinel at top resets to intro
  const sentinel = Object.assign(document.createElement('div'), {
    style: 'height:1px;pointer-events:none;'
  });
  shots.prepend(sentinel);
  new IntersectionObserver(e => { if (e[0].isIntersecting) setActive('__intro'); },
    { threshold: 0, rootMargin: '0px 0px -95% 0px' }
  ).observe(sentinel);

  new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) setActive(e.target.dataset.id); });
  }, { threshold: 0, rootMargin: '-20% 0px -55% 0px' }
  ).observe(...sections, sections); // observe each
  sections.forEach(s =>
    new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) setActive(e.target.dataset.id); });
    }, { threshold: 0, rootMargin: '-20% 0px -55% 0px' }).observe(s)
  );

  /* ── VIDEO AUTOPLAY ── */
  const noMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  new IntersectionObserver(entries => {
    entries.forEach(e => {
      const v = e.target;
      if (noMotion) { v.removeAttribute('autoplay'); return; }
      v.removeAttribute('controls');
      e.isIntersecting ? v.play().catch(() => {}) : v.pause();
    });
  }, { threshold: 0.2 }).observe(
    ...document.querySelectorAll('video[data-autoplay]')
  );
  document.querySelectorAll('video[data-autoplay]').forEach(v =>
    new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (noMotion) { v.removeAttribute('autoplay'); return; }
        v.removeAttribute('controls');
        e.isIntersecting ? v.play().catch(() => {}) : v.pause();
      });
    }, { threshold: 0.2 }).observe(v)
  );
})();
</script>
</body>
</html>
