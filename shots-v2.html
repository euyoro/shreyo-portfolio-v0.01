<style>
  /* ── TOKENS ── */
  :root {
    --bg:     #F6F3EF;
    --text:   #100E0C;
    --muted:  #9A9390;
    --accent: #BF2A20;
    --rule:   rgba(16,14,12,0.09);
    --serif:  'Cormorant Garamond', Georgia, serif;
    --sans:   'HK Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --ease:   cubic-bezier(0.76, 0, 0.24, 1);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    overflow-x: hidden;
  }

  /* ── HEADER (fixed) ── */
  .hdr {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 22px 48px;
    pointer-events: none;
  }
  .hdr > * { pointer-events: auto; }

  .hdr-logo {
    font-family: var(--serif);
    font-size: 17px;
    font-weight: 400;
    letter-spacing: 0.01em;
    text-decoration: none;
    color: var(--text);
  }
  .hdr-logo em { font-style: italic; font-weight: 300; }

  .hdr-nav { display: flex; gap: 36px; list-style: none; }
  .hdr-nav a {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--muted);
    transition: color 0.2s;
  }
  .hdr-nav a:hover { color: var(--text); }

  /* ── INTRO (full viewport) ── */
  .intro {
    height: 100vh;
    display: grid;
    grid-template-rows: 1fr auto;
    padding: 100px 48px 56px;
    border-bottom: 1px solid var(--rule);
    overflow: hidden;
  }
  .intro-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }
  .intro-count {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 4px;
  }
  .intro-bottom {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 40px;
  }
  .intro-tagline {
    font-family: var(--serif);
    font-size: clamp(56px, 8.5vw, 120px);
    font-weight: 300;
    line-height: 0.95;
    letter-spacing: -0.01em;
  }
  .intro-tagline em { font-style: italic; }
  .intro-sub {
    max-width: 260px;
    font-size: 13px;
    line-height: 1.7;
    color: var(--muted);
    padding-bottom: 8px;
  }

  /* ── WORK: Malvah-style sticky right ── */
  .work-wrap {
    display: grid;
    grid-template-columns: 58fr 42fr;
    align-items: start;
    border-bottom: 1px solid var(--rule);
  }

  /* Left column: images scroll normally */
  .work-images {
    border-right: 1px solid var(--rule);
  }
  .work-slide {
    height: 100vh;
    overflow: hidden;
    border-bottom: 1px solid var(--rule);
  }
  .work-slide:last-child { border-bottom: none; }
  .work-slide img,
  .work-slide video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Right column: sticky info panel */
  .work-info {
    position: sticky;
    top: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 100px 56px 56px;
    overflow: hidden;
  }

  /* Info content — fades when project changes */
  .info-inner {
    display: flex;
    flex-direction: column;
    gap: 0;
    transition: opacity 0.35s var(--ease), transform 0.35s var(--ease);
  }
  .info-inner.out {
    opacity: 0;
    transform: translateY(14px);
  }

  .info-num {
    font-size: 10px;
    letter-spacing: 0.14em;
    color: var(--muted);
    margin-bottom: 20px;
  }
  .info-name {
    font-family: var(--serif);
    font-size: clamp(36px, 4.2vw, 62px);
    font-weight: 400;
    line-height: 1.05;
    letter-spacing: -0.01em;
    margin-bottom: 20px;
  }
  .info-tag {
    display: inline-block;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 20px;
  }
  .info-desc {
    font-size: 13px;
    line-height: 1.75;
    color: var(--muted);
    max-width: 340px;
  }
  .info-rule {
    width: 28px;
    height: 1px;
    background: var(--rule);
    margin: 24px 0;
  }

  /* ── FOOTER ── */
  .footer {
    padding: 44px 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
  }
  .footer-links { display: flex; gap: 32px; }
  .footer-links a {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--muted);
    transition: color 0.2s;
  }
  .footer-links a:hover { color: var(--text); }
  .footer-copy {
    font-family: var(--serif);
    font-size: 13px;
    color: var(--muted);
    font-style: italic;
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 640px) {
    .hdr { padding: 18px 24px; }
    .intro { padding: 90px 24px 44px; }
    .work-wrap { grid-template-columns: 1fr; }
    .work-info { position: static; height: auto; padding: 32px 24px 44px; border-top: 1px solid var(--rule); }
    .work-slide { height: 70vw; }
    .footer { padding: 32px 24px; }
  }
  @media (max-width: 480px) {
    .hdr-nav { gap: 20px; }
    .intro-bottom { flex-direction: column; align-items: flex-start; }
    .intro-tagline { font-size: 48px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .info-inner { transition: none; }
  }
</style>
</head>
<body>

<header class="hdr" id="hdr"></header>
<section class="intro" id="intro"></section>

<div class="work-wrap" id="work-wrap">
  <div class="work-images" id="work-images"></div>
  <div class="work-info" id="work-info">
    <div class="info-inner" id="info-inner">
      <span class="info-num" id="info-num"></span>
      <h2 class="info-name" id="info-name"></h2>
      <span class="info-tag" id="info-tag"></span>
      <div class="info-rule"></div>
      <p class="info-desc" id="info-desc"></p>
    </div>
  </div>
</div>

<footer class="footer" id="footer"></footer>

<script>
(function () {
  const data = JSON.parse(document.getElementById('shots-data').textContent);
  const { designer, categories } = data;

  /* ── HEADER ── */
  const hdr = document.getElementById('hdr');
  hdr.innerHTML = `
    <a class="hdr-logo" href="index.html">Shreyo <em>Debnath</em></a>
    <ul class="hdr-nav">
      ${designer.links.map(l =>
        `<li><a href="${l.href}"${l.external ? ' target="_blank" rel="noopener"' : ''}>${l.label}</a></li>`
      ).join('')}
    </ul>`;

  /* ── INTRO ── */
  document.getElementById('intro').innerHTML = `
    <div class="intro-top">
      <span class="intro-count">(${categories.length.toString().padStart(2,'0')}) Selected Works</span>
    </div>
    <div class="intro-bottom">
      <h1 class="intro-tagline">I design<br><em>products.</em><br>I build<br><em>tools.</em></h1>
      <p class="intro-sub">Product designer with a bias for shipping. I work end-to-end&nbsp;— from research to deployed product.</p>
    </div>`;

  /* ── IMAGES COLUMN ── */
  const imagesCol = document.getElementById('work-images');
  categories.forEach((cat, i) => {
    const slide = document.createElement('div');
    slide.className = 'work-slide';
    slide.dataset.index = i;
    const heroItem = { src: cat.hero, type: cat.hero.endsWith('.mp4') ? 'video' : 'image' };
    slide.innerHTML = heroItem.type === 'video'
      ? `<video src="${heroItem.src}" autoplay muted loop playsinline></video>`
      : `<img src="${cat.hero}" alt="${cat.label}" loading="lazy">`;
    imagesCol.appendChild(slide);
  });

  /* ── STICKY INFO PANEL ── */
  const infoNum  = document.getElementById('info-num');
  const infoName = document.getElementById('info-name');
  const infoTag  = document.getElementById('info-tag');
  const infoDesc = document.getElementById('info-desc');
  const inner    = document.getElementById('info-inner');

  let currentIdx = -1;

  function setInfo(idx) {
    if (idx === currentIdx) return;
    currentIdx = idx;
    const cat = categories[idx];

    inner.classList.add('out');
    setTimeout(() => {
      infoNum.textContent  = `0${idx + 1} / 0${categories.length}`;
      infoName.textContent = cat.label;
      infoTag.textContent  = cat.tag;
      infoDesc.textContent = cat.description;
      inner.classList.remove('out');
    }, 350);
  }

  /* Seed with first project */
  setInfo(0);

  /* IntersectionObserver: update right panel as slides scroll in */
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        setInfo(Number(e.target.dataset.index));
      }
    });
  }, { threshold: 0.5 });

  document.querySelectorAll('.work-slide').forEach(s => obs.observe(s));

  /* ── FOOTER ── */
  document.getElementById('footer').innerHTML = `
    <div class="footer-links">
      ${designer.links.map(l =>
        `<a href="${l.href}"${l.external ? ' target="_blank" rel="noopener"' : ''}>${l.label}</a>`
      ).join('')}
    </div>
    <span class="footer-copy">SD©${new Date().getFullYear()}</span>`;

})();
</script>
</body>
</html>
