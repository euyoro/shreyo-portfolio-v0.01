<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Eye">
  <rect width="32" height="32" rx="7" fill="#edfe34"/>

  <!-- Outer eyelid shape — morphs closed during blink -->
  <path fill="#000">
    <animate attributeName="d"
      values="M3.5 16Q16 6.5 28.5 16Q16 25.5 3.5 16Z;
              M3.5 16Q16 6.5 28.5 16Q16 25.5 3.5 16Z;
              M3.5 16Q16 15.7 28.5 16Q16 16.3 3.5 16Z;
              M3.5 16Q16 15.7 28.5 16Q16 16.3 3.5 16Z;
              M3.5 16Q16 6.5 28.5 16Q16 25.5 3.5 16Z;
              M3.5 16Q16 6.5 28.5 16Q16 25.5 3.5 16Z"
      keyTimes="0;0.70;0.76;0.82;0.88;1"
      dur="4s" repeatCount="indefinite" calcMode="linear"/>
  </path>

  <!-- Eye white -->
  <ellipse cx="16" cy="16" rx="7.5" fill="#e8e8e0">
    <animate attributeName="ry"
      values="5;5;0;0;5;5"
      keyTimes="0;0.70;0.76;0.82;0.88;1"
      dur="4s" repeatCount="indefinite" calcMode="linear"/>
  </ellipse>

  <!-- Pupil -->
  <circle cx="16" cy="16" fill="#000">
    <animate attributeName="r"
      values="3.5;3.5;0;0;3.5;3.5"
      keyTimes="0;0.70;0.76;0.82;0.88;1"
      dur="4s" repeatCount="indefinite" calcMode="linear"/>
  </circle>

  <!-- Shine -->
  <circle cx="17.6" cy="14.4" fill="#fff">
    <animate attributeName="r"
      values="1.1;1.1;0;0;1.1;1.1"
      keyTimes="0;0.70;0.76;0.82;0.88;1"
      dur="4s" repeatCount="indefinite" calcMode="linear"/>
  </circle>
</svg>
